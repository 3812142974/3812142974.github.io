<html lang="zh-CN">

<title>应急食品-bot插件中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 30px 20px; text-align: center; }
.header h1 { font-size: 28px; margin-bottom: 6px; }
.header p { font-size: 14px; opacity: .85; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 24px; max-width: 1400px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; padding: 20px 16px; cursor: pointer; transition: all .2s; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.card .name { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 6px; }
.card .brief { font-size: 12px; color: #999; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .tags { margin-top: 10px; display: flex; gap: 4px; flex-wrap: wrap; }
.card .tag { display: inline-block; background: #ede9fe; color: #7c3aed; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
.card .tag.funny { background: #fef3c7; color: #d97706; }

.plugin-view { display: none; max-width: 1400px; margin: 0 auto; padding: 24px; }
.plugin-view.active { display: block; }
.plugin-top { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.plugin-top .back-btn { display: inline-flex; align-items: center; gap: 4px; color: #667eea; font-size: 14px; cursor: pointer; border: none; background: none; padding: 8px 0; flex-shrink: 0; white-space: nowrap; }
.plugin-top .back-btn:hover { color: #764ba2; }
.plugin-top .plugin-info { flex: 1; }
.plugin-top .plugin-name { font-size: 24px; font-weight: 700; color: #1a1a2e; }
.plugin-top .plugin-brief { font-size: 14px; color: #666; line-height: 1.6; margin-top: 4px; }
.plugin-top .plugin-tags { margin-top: 8px; display: flex; gap: 4px; }
.plugin-top .plugin-tags .tag { display: inline-block; background: #ede9fe; color: #7c3aed; font-size: 11px; padding: 3px 10px; border-radius: 10px; }
.plugin-top .plugin-tags .tag.funny { background: #fef3c7; color: #d97706; }

.search-bar { margin-bottom: 12px; }
.search-bar input { width: 100%; padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
.search-bar input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.1); }
.count-info { font-size: 12px; color: #999; margin-bottom: 8px; }

.meme-table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e8e8e8; table-layout: fixed; }
.meme-table td { padding: 8px 6px; border: 1px solid #f0f0f0; cursor: pointer; text-align: center; word-break: break-all; transition: background .2s, color .2s; vertical-align: middle; }
.meme-table td::selection { background: transparent; }
/* 点击选中 */
.meme-table td.active { background: #7c3aed !important; color: #fff; font-weight: 700; }
/* hover 中心 */
.meme-table td.hl { background: #7c3aed !important; color: #fff; font-weight: 700; }
/* hover 渐变层1 - 最近邻 */
.meme-table td.hl-n1 { background: #c4b5fd; }
/* hover 渐变层2 - 稍远 */
.meme-table td.hl-n2 { background: #ede9fe; }

.img-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.6); z-index: 200; display: none; justify-content: center; align-items: center; }
.img-overlay.active { display: flex; }
.img-modal { background: #fff; border-radius: 16px; padding: 20px; max-width: 90vw; max-height: 90vh; overflow: auto; text-align: center; animation: popIn .25s ease; position: relative; }
.img-modal .close-btn { position: absolute; top: 12px; right: 16px; font-size: 24px; color: #999; cursor: pointer; border: none; background: none; line-height: 1; }
.img-modal .close-btn:hover { color: #333; }
.img-modal img { max-width: 100%; max-height: 70vh; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
.img-modal .img-name { font-size: 13px; color: #666; margin-top: 10px; }

.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.45); z-index: 100; display: none; justify-content: center; align-items: center; }
.overlay.active { display: flex; }
.detail { background: #fff; border-radius: 16px; width: 90%; max-width: 520px; max-height: 80vh; overflow-y: auto; animation: popIn .25s ease; }
@keyframes popIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.detail-header { padding: 24px 28px 16px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; background: #fff; border-radius: 16px 16px 0 0; z-index: 1; }
.detail-header .ov-back-btn { display: inline-flex; align-items: center; gap: 4px; color: #667eea; font-size: 14px; cursor: pointer; margin-bottom: 10px; border: none; background: none; padding: 4px 0; }
.detail-header .ov-back-btn:hover { color: #764ba2; }
.detail-header .detail-name { font-size: 22px; font-weight: 700; color: #1a1a2e; }
.detail-body { padding: 16px 28px 28px; }
.detail-body .detail-brief { font-size: 14px; color: #666; line-height: 1.7; padding: 12px 16px; background: #f8f9fb; border-radius: 10px; margin-bottom: 20px; }
.detail-body .section-title { font-size: 13px; color: #999; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.detail-body .commands { background: #1e1e2e; color: #cdd6f4; border-radius: 10px; padding: 16px 20px; font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; line-height: 1.8; min-height: 60px; }

@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
  .card { padding: 14px 12px; }
  .card .name { font-size: 14px; }
  .plugin-view { padding: 12px; }
  .plugin-top { flex-direction: column; gap: 8px; }
  .meme-table { font-size: 10px; }
  .meme-table td { padding: 4px 2px; }
}
</style>

const COLS = 8;
const grid = document.getElementById('grid');
const pluginView = document.getElementById('pluginView');
const overlay = document.getElementById('overlay');
const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const countInfo = document.getElementById('countInfo');
const imgOverlay = document.getElementById('imgOverlay');
const imgPreview = document.getElementById('imgPreview');
const imgName = document.getElementById('imgName');

function renderCards() {
  grid.style.display = '';
  pluginView.classList.remove('active');
  grid.innerHTML = plugins.map(p => {
    const tagsHtml = p.tags.map(t => `<span class="tag${t==='搞笑'?' funny':''}">${t}</span>`).join('');
    return `<div class="card" data-id="${p.id}">
      <div class="name">${p.name}</div>
      <div class="brief">${p.brief}</div>
      <div class="tags">${tagsHtml}</div>
    </div>`;
  }).join('');
}

function renderTable(items) {
  const rows = [];
  for (let i = 0; i < items.length; i += COLS) {
    const cells = [];
    for (let j = 0; j < COLS; j++) {
      const idx = i + j;
      if (idx < items.length) {
        const m = items[idx];
        const escaped = m.display.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        cells.push(`<td data-file="${m.file.replace(/"/g, '&quot;')}" data-idx="${idx}">${escaped}</td>`);
      } else {
        cells.push('<td></td>');
      }
    }
    rows.push(`<tr>${cells.join('')}</tr>`);
  }
  tableBody.innerHTML = rows.join('');
  countInfo.textContent = `共 ${items.length} 条指令`;
}

function filterItems(query) {
  if (!query) return memeItems;
  const q = query.toLowerCase();
  return memeItems.filter(m => m.display.toLowerCase().includes(q));
}

function openPlugin(p) {
  grid.style.display = 'none';
  pluginView.classList.add('active');
  document.getElementById('pvName').textContent = p.name;
  document.getElementById('pvBrief').textContent = p.brief;
  const tagsHtml = p.tags.map(t => `<span class="tag${t==='搞笑'?' funny':''}">${t}</span>`).join('');
  document.getElementById('pvTags').innerHTML = tagsHtml;
  searchInput.value = '';
  renderTable(memeItems);
}

function openOverlay(p) {
  document.getElementById('detailName').textContent = p.name;
  document.getElementById('detailBrief').textContent = p.brief;
  document.getElementById('detailCommands').textContent = '（待填写）';
  overlay.classList.add('active');
}

function showImg(file) {
  imgPreview.src = 'memes/' + encodeURIComponent(file);
  imgName.textContent = file;
  imgOverlay.classList.add('active');
}

function closeImg() {
  imgOverlay.classList.remove('active');
  // 清除所有 active 状态
  tableBody.querySelectorAll('td').forEach(t => t.classList.remove('active'));
}

// hover 渐变效果
function clearHover() {
  tableBody.querySelectorAll('td.hl, td.hl-n1, td.hl-n2').forEach(t => {
    t.classList.remove('hl', 'hl-n1', 'hl-n2');
  });
}

function applyHover(td) {
  clearHover();
  if (!td || !td.dataset.file) return;
  const tr = td.parentElement;
  const row = Array.from(tableBody.rows).indexOf(tr);
  const col = Array.from(tr.cells).indexOf(td);
  td.classList.add('hl');
  // 给周围格子加渐变层
  const rows = tableBody.rows;
  const dist = (r, c) => Math.abs(r - row) + Math.abs(c - col);
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = rows[r].cells[c];
      if (!cell || !cell.dataset.file) continue;
      const d = dist(r, c);
      if (d === 1) cell.classList.add('hl-n1');
      else if (d === 2) cell.classList.add('hl-n2');
    }
  }
}

tableBody.addEventListener('mouseover', e => {
  const td = e.target.closest('td');
  if (td && td.dataset.file) applyHover(td);
});

tableBody.addEventListener('mouseleave', () => clearHover());

renderCards();

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const p = plugins.find(x => x.id === Number(card.dataset.id));
  if (!p) return;
  if (p.hasTable) openPlugin(p);
  else openOverlay(p);
});

document.getElementById('pluginBack').addEventListener('click', () => {
  grid.style.display = '';
  pluginView.classList.remove('active');
  clearHover();
});

overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('active'); });
document.getElementById('ovBackBtn').addEventListener('click', () => overlay.classList.remove('active'));

imgOverlay.addEventListener('click', e => { if (e.target === imgOverlay) closeImg(); });
document.getElementById('imgClose').addEventListener('click', closeImg);

searchInput.addEventListener('input', () => renderTable(filterItems(searchInput.value)));

tableBody.addEventListener('click', e => {
  const td = e.target.closest('td');
  if (!td || !td.dataset.file) return;
  tableBody.querySelectorAll('td').forEach(t => t.classList.remove('active'));
  td.classList.add('active');
  showImg(td.dataset.file);
});
</script>
