<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YJSP 插件中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 30px 20px; text-align: center; }
.header h1 { font-size: 28px; margin-bottom: 6px; }
.header p { font-size: 14px; opacity: .85; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 24px; max-width: 1400px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; padding: 20px 16px; cursor: pointer; transition: all .2s; box-shadow: 0 2px 8px rgba(0,0,0,.08); position: relative; }
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.card .name { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 6px; }
.card .brief { font-size: 12px; color: #999; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .tag { display: inline-block; background: #ede9fe; color: #7c3aed; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-top: 10px; }
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.45); z-index: 100; display: none; justify-content: center; align-items: center; }
.overlay.active { display: flex; }
.detail { background: #fff; border-radius: 16px; width: 90%; max-width: 520px; max-height: 80vh; overflow-y: auto; padding: 0; animation: popIn .25s ease; position: relative; }
@keyframes popIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.detail-header { padding: 24px 28px 16px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; background: #fff; border-radius: 16px 16px 0 0; z-index: 1; }
.detail-header .back-btn { display: inline-flex; align-items: center; gap: 4px; color: #667eea; font-size: 14px; cursor: pointer; margin-bottom: 10px; border: none; background: none; padding: 4px 0; }
.detail-header .back-btn:hover { color: #764ba2; }
.detail-header .detail-name { font-size: 22px; font-weight: 700; color: #1a1a2e; }
.detail-body { padding: 16px 28px 28px; }
.detail-body .detail-brief { font-size: 14px; color: #666; line-height: 1.7; padding: 12px 16px; background: #f8f9fb; border-radius: 10px; margin-bottom: 20px; }
.detail-body .section-title { font-size: 13px; color: #999; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.detail-body .commands { background: #1e1e2e; color: #cdd6f4; border-radius: 10px; padding: 16px 20px; font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; line-height: 1.8; min-height: 60px; }
.fab { position: fixed; right: 28px; bottom: 28px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; font-size: 28px; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(102,126,234,.4); transition: all .2s; z-index: 50; display: flex; align-items: center; justify-content: center; }
.fab:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(102,126,234,.5); }
@media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; } .card { padding: 14px 12px; } .card .name { font-size: 14px; } }
</style>
</head>
<body>

<div class="header">
  <h1>YJSP 插件中心</h1>
  <p>共 54 个插件 · 点击卡片查看详情</p>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="detail" id="detail">
    <div class="detail-header">
      <button class="back-btn" id="backBtn">← 返回</button>
      <div class="detail-name" id="detailName"></div>
    </div>
    <div class="detail-body">
      <div class="detail-brief" id="detailBrief"></div>
      <div class="section-title">指令列表</div>
      <div class="commands" id="detailCommands"></div>
    </div>
  </div>
</div>

<button class="fab" id="fab" title="添加插件">+</button>

];

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const detail = document.getElementById('detail');
const detailName = document.getElementById('detailName');
const detailBrief = document.getElementById('detailBrief');
const detailCommands = document.getElementById('detailCommands');
const backBtn = document.getElementById('backBtn');
const fab = document.getElementById('fab');

function renderCards() {
  grid.innerHTML = plugins.map(p =>
    `<div class="card" data-id="${p.id}">
      <div class="name">${p.name}</div>
      <div class="brief">${p.brief}</div>
      <div class="tag">插件</div>
    </div>`
  ).join('');
}

function openDetail(id) {
  const p = plugins.find(x => x.id === id);
  if (!p) return;
  detailName.textContent = p.name;
  detailBrief.textContent = p.brief;
  detailCommands.textContent = '（待填写）';
  overlay.classList.add('active');
}

function closeDetail() {
  overlay.classList.remove('active');
}

renderCards();

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openDetail(Number(card.dataset.id));
});

overlay.addEventListener('click', e => {
  if (e.target === overlay) closeDetail();
});

backBtn.addEventListener('click', closeDetail);

let nextId = 55;
fab.addEventListener('click', () => {
  const newPlugin = { id: nextId, name: `插件 ${String(nextId).padStart(2,'0')}`, brief: '待补充简介内容' };
  plugins.push(newPlugin);
  nextId++;
  renderCards();
  const countEl = document.querySelector('.header p');
  countEl.textContent = `共 ${plugins.length} 个插件 · 点击卡片查看详情`;
  openDetail(newPlugin.id);
});

</body>
</html>
